# Copy deploy/.env.example to deploy/.env and fill it in before `docker compose up`.
# Only Caddy is published; it terminates TLS for the web UI, the API (/api) and
# the Headscale control server. Every other service is reachable only on the
# compose network.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.1-alpine@sha256:3b2a0196e0687279c14c27adff9fc6b44acfa318dbb97eaebe385bdf99e5364c
    cap_add: [NET_BIND_SERVICE]
    environment:
      COVAFLUX_DOMAIN: ${COVAFLUX_DOMAIN:?set COVAFLUX_DOMAIN in deploy/.env}
      HEADSCALE_DOMAIN: ${HEADSCALE_DOMAIN:?set HEADSCALE_DOMAIN in deploy/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: [/tmp]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    mem_limit: 256m
    pids_limit: 128
    depends_on: [covaflux-web, covaflux-api, headscale]

  headscale:
    <<: *hardening
    build:
      context: ./headscale-runtime
    # Root only for the entrypoint's ownership fix before it drops privileges.
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      HEADSCALE_SERVER_URL: https://${HEADSCALE_DOMAIN:?set HEADSCALE_DOMAIN in deploy/.env}
      HEADSCALE_API_KEY_EXPIRATION: ${HEADSCALE_API_KEY_EXPIRATION:-90d}
      HEADSCALE_API_KEY_ROTATE_AFTER_DAYS: ${HEADSCALE_API_KEY_ROTATE_AFTER_DAYS:-60}
    volumes:
      - headscale-data:/var/lib/headscale
      - ./headscale:/etc/headscale:ro
      - covaflux-secrets:/secrets
    tmpfs:
      - /tmp
      - /var/run/headscale:uid=10000,gid=10000,mode=0750
    # Healthy once Headscale answers and the CovaFlux API key has been written.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/headscale-ready && wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    pids_limit: 256

  covaflux-api:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/covaflux.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in deploy/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: "true"
      HEADSCALE_BASE_URL: http://headscale:8080
      HEADSCALE_CLIENT_MODE: rest
      HEADSCALE_API_KEY_FILE: /secrets/headscale_api_key
      SECRETS_GID: "10001"
      HOME: /tmp
    volumes:
      - covaflux-data:/data
      - covaflux-secrets:/secrets:ro
    tmpfs: [/tmp]
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      headscale:
        condition: service_healthy

  covaflux-web:
    <<: *hardening
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_HEADSCALE_URL: https://${HEADSCALE_DOMAIN:?set HEADSCALE_DOMAIN in deploy/.env}
    tmpfs: [/tmp]
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      - covaflux-api

volumes:
  caddy-data:
  caddy-config:
  headscale-data:
  covaflux-data:
  covaflux-secrets:
