# Public URL clients use as --login-server. docker-compose.yml overrides it
# with HEADSCALE_SERVER_URL=https://${HEADSCALE_DOMAIN}; TLS terminates at Caddy.
server_url: https://headscale.example.com
listen_addr: 0.0.0.0:8080
# Metrics/debug and gRPC are management surfaces: keep them inside the
# container. The CLI uses the unix socket; CovaFlux uses the REST API.
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

private_key_path: /var/lib/headscale/private.key
noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

policy:
  mode: database

dns:
  magic_dns: true
  base_domain: covaflux.local
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default

log:
  level: info
  format: text
