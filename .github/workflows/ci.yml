name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -f apps/api/Dockerfile -t covaflux-api:ci .
      - run: docker build -f apps/web/Dockerfile -t covaflux-web:ci .
      - run: docker build -t covaflux-headscale:ci deploy/headscale-runtime
      - name: Compose file is valid
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^JWT_SECRET=$/JWT_SECRET=ci-only-secret-0123456789abcdef0123456789/; s/^BOOTSTRAP_ADMIN_PASSWORD=$/BOOTSTRAP_ADMIN_PASSWORD=ci-only-password/' deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
